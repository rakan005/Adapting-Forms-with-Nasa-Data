spring:
  application:
    name: crop-advisor-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/advisor;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

advisor:
  cors:
    allowed-origins: ${ADVISOR_CORS_ALLOWED_ORIGINS:https://crop-advisor-team-demo.boxyfoam2.chatgpt.site,http://localhost:4173,http://localhost:8080}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_GENERATE_CONTENT_URL:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent}
  climate:
    provider: fixture
  email:
    from: ${MAIL_FROM:no-reply@crop-advisor.local}
    delivery-mode: ${EMAIL_DELIVERY_MODE:smtp}
    app-name: ${APP_NAME:مستشار المحاصيل}
  otp:
    hash-secret: ${OTP_HASH_SECRET:local-development-only-change-me}
    code-ttl-minutes: ${OTP_CODE_TTL_MINUTES:10}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  packs:
    location: classpath:/packs/

management:
  endpoints:
    web:
      exposure:
        include: health,info
