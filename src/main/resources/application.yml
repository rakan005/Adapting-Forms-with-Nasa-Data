spring:
  application:
    name: crop-advisor-backend
  datasource:
    url: jdbc:h2:file:./data/advisor;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

advisor:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_GENERATE_CONTENT_URL:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent}
  climate:
    provider: fixture
  packs:
    location: classpath:/packs/

management:
  endpoints:
    web:
      exposure:
        include: health,info
